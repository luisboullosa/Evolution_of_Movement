<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Fitness Landscape Explorer</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f1219;
      --panel: #171c27;
      --panel2: #1e2533;
      --border: #2d3648;
      --text: #e8ecf4;
      --muted: #9aa6bd;
      --accent: #6ea8fe;
      --accent2: #7ee787;
      --warn: #f0b429;
      --danger: #ff7b72;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1a2740 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 20px 28px 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 18, 25, 0.85);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { margin: 0 0 6px; font-size: 1.45rem; font-weight: 600; }
    header p { margin: 0; color: var(--muted); font-size: 0.92rem; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      padding: 14px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    label { font-size: 0.85rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
    select, button {
      background: var(--panel2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.9rem;
    }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    .metric-toggle { display: flex; gap: 6px; }
    .metric-toggle button.active {
      background: #243049;
      border-color: var(--accent);
      color: #fff;
    }
    .help-tip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #2a3347;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      cursor: help;
      margin-left: 6px;
      position: relative;
    }
    .help-tip:hover::after, .help-tip:focus::after {
      content: attr(data-tip);
      position: absolute;
      left: 24px;
      top: -4px;
      width: min(340px, 70vw);
      padding: 10px 12px;
      background: #111722;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-weight: 400;
      font-size: 0.82rem;
      line-height: 1.45;
      z-index: 20;
      white-space: pre-line;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    .help-tip.wide:hover::after, .help-tip.wide:focus::after {
      width: min(400px, 80vw);
    }
    main { padding: 18px 28px 40px; }
    .arch-section {
      margin-bottom: 36px;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: rgba(23, 28, 39, 0.7);
    }
    .arch-header {
      padding: 14px 18px;
      background: linear-gradient(90deg, #1c2435, #171c27);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }
    .arch-header h2 { margin: 0; font-size: 1.15rem; }
    .arch-header span { color: var(--muted); font-size: 0.85rem; }
    .arch-body {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(340px, 480px);
      gap: 0;
    }
    @media (max-width: 960px) {
      .arch-body { grid-template-columns: 1fr; }
    }
    .heatmap-wrap { padding: 16px; border-right: 1px solid var(--border); }
    .side-panel {
      padding: 16px;
      background: #141925;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 360px;
    }
    table.heatmap {
      border-collapse: collapse;
      width: 100%;
      font-size: 12px;
    }
    table.heatmap th, table.heatmap td {
      border: 1px solid #2a3347;
      padding: 7px 6px;
      text-align: center;
    }
    table.heatmap th { background: #1f2738; color: var(--muted); font-weight: 500; }
    table.heatmap td { cursor: pointer; transition: outline 0.1s; }
    table.heatmap td.selected { outline: 2px solid var(--accent2); outline-offset: -2px; }
    table.heatmap td:hover { filter: brightness(1.08); }
    table.heatmap td.pending {
      color: #8b95a8;
      font-size: 0.72rem;
      font-style: italic;
      letter-spacing: 0.02em;
    }
    .panel-card {
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }
    .panel-card h3 {
      margin: 0 0 8px;
      font-size: 0.95rem;
      color: #d7deec;
    }
    .cell-meta { font-size: 0.82rem; color: var(--muted); line-height: 1.5; }
    .chart-box { height: 220px; position: relative; }
    canvas.brain-canvas {
      display: block;
      width: 100%;
      height: 200px;
      border-radius: 8px;
      background: #121722;
      border: 1px solid var(--border);
    }
    .legend-bar {
      height: 10px;
      border-radius: 999px;
      margin: 8px 0 4px;
      background: linear-gradient(90deg, #2b6cb0, #68d391, #f6e05e, #fc8181);
    }
    .legend-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .empty-hint { color: var(--muted); font-size: 0.9rem; padding: 24px 8px; text-align: center; }
    .convergence-note {
      margin-top: 6px;
      font-size: 0.8rem;
      color: var(--warn);
    }
    .panel-collapsible.hex-probe-card .panel-collapsible-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    canvas.hex-probe-canvas {
      display: block;
      width: 100%;
      height: 240px;
      border-radius: 8px;
      background: #0d1118;
      border: 1px solid var(--border);
      cursor: crosshair;
    }
    .probe-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .probe-controls label {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .probe-controls input[type="range"] { width: 100%; accent-color: var(--accent); }
    .probe-controls select {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 0.78rem;
    }
    .probe-decision {
      font-size: 0.8rem;
      line-height: 1.45;
      color: #c5d0e6;
      padding: 8px 10px;
      background: #121722;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .probe-decision .gather { color: var(--accent2); }
    .probe-decision .move { color: var(--accent); }
    .probe-response-box { height: 160px; position: relative; }
    .probe-response-box.timeline-active { height: 240px; }
    .probe-timeline-note { font-size: 0.72rem; color: var(--muted); margin-top: 4px; line-height: 1.35; }
    .probe-response-status {
      font-size: 0.75rem;
      color: var(--muted);
      min-height: 1.1em;
    }
    .probe-response-status.warn { color: var(--warn); }
    .probe-wasm-note { font-size: 0.75rem; color: var(--warn); }
    .probe-stats { font-size: 0.78rem; }
    .panel-collapsible { padding: 0; overflow: hidden; }
    .panel-collapsible:not([open]) > .panel-collapsible-body { display: none; }
    .panel-collapsible > summary {
      padding: 12px;
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      user-select: none;
      border-radius: 10px;
    }
    .panel-collapsible[open] > summary {
      border-bottom: 1px solid var(--border);
      border-radius: 10px 10px 0 0;
    }
    .panel-collapsible > summary::-webkit-details-marker { display: none; }
    .panel-collapsible > summary::before {
      content: '▸';
      margin-right: 8px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .panel-collapsible[open] > summary::before { content: '▾'; }
    .panel-collapsible > summary h3 { margin: 0; }
    .panel-collapsible-body { padding: 0 12px 12px; }
    .trajectory-chart-wrap {
      height: 220px;
      position: relative;
      margin-top: 4px;
    }
    .metric-export-banner {
      margin: 0 0 16px;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(240, 180, 41, 0.08);
      color: #e8d090;
      font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Fitness Landscape Explorer</h1>
    <p id="meta-line">Loading…</p>
  </header>
  <div class="toolbar">
    <label>Architecture
      <select id="arch-filter"><option value="all">All</option></select>
    </label>
    <label>Founder weights
      <select id="founder-filter"></select>
    </label>
    <div>
      <span style="font-size:0.85rem;color:var(--muted)">Heatmap metric</span>
      <div class="metric-toggle" id="metric-toggle">
        <button type="button" data-metric="fitness" class="active">
          Fitness
          <span class="help-tip wide" tabindex="0" id="fitness-help" data-tip="">?</span>
        </button>
        <button type="button" data-metric="pop_ratio">Pop ratio</button>
        <button type="button" data-metric="complexity">
          Mean complexity
          <span class="help-tip" tabindex="0" id="complexity-help" data-tip="">?</span>
        </button>
        <button type="button" data-metric="fecundity">
          Fecundity
          <span class="help-tip" tabindex="0" id="fecundity-help" data-tip="Top individual duplication count at run end — requires fecundity_matrix from sweep export.">?</span>
        </button>
      </div>
    </div>
    <button type="button" id="compare-seeds-btn" title="Overlay neutral vs random trajectories for selected cell">Compare seed modes</button>
    <button type="button" id="rebuild-timelines-btn" title="Rebuild probe_timelines/ from snapshots (requires scripts/serve_fitness_landscape.py, not plain http.server)">Rebuild probe timelines</button>
    <button type="button" id="live-btn" class="active" title="Poll fitness_landscape.sqlite for new runs while sweep is active">Live updates</button>
    <button type="button" id="load-db-btn" title="Load fitness_landscape.sqlite (for file:// or custom paths)">Load database…</button>
    <input type="file" id="db-file-input" accept=".sqlite,.db,.sqlite3" hidden/>
  </div>
  <main id="root"></main>
  <script id="landscape-data" type="application/json">__LANDSCAPE_JSON__</script>
  <script>
  let DATA = null;
  const charts = new Map();
  let selected = null;
  let compareSeeds = false;
  let metric = 'fitness';
  let liveEnabled = true;
  let livePollTimer = null;
  let lastUpdatedAtMs = 0;
  let dbUrl = 'fitness_landscape.sqlite';
  let viewerBooted = false;
  let wasmProbe = null;
  let wasmProbeError = '';
  const hexProbes = new Map();
  let timelineManifest = null;
  let timelineManifestError = '';
  let timelineManifestPromise = null;
  const timelineCache = new Map();
  const TIMELINE_STYLES = {
    0: { label: 't=0 founder', color: '#9aa6bd', dash: [6, 4] },
    10000: { label: 't=10K best', color: '#6ea8fe', dash: [] },
    50000: { label: 't=50K best', color: '#7ee787', dash: [] },
  };
  const HEX_PROBE_RADIUS = 5; // diameter 10 (axial disk)
  let sqlJsPromise = null;

  const SQLJS_BASE = 'https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/';

  function setMetaStatus(msg) {
    const el = document.getElementById('meta-line');
    if (el) el.textContent = msg;
  }

  function loadSqlJsModule() {
    if (sqlJsPromise) return sqlJsPromise;
    sqlJsPromise = new Promise((resolve, reject) => {
      if (typeof initSqlJs === 'function') {
        initSqlJs({ locateFile: file => `${SQLJS_BASE}${file}` }).then(resolve).catch(reject);
        return;
      }
      const script = document.createElement('script');
      script.src = `${SQLJS_BASE}sql-wasm.js`;
      script.async = true;
      script.onload = () => {
        if (typeof initSqlJs !== 'function') {
          reject(new Error('sql.js loaded but initSqlJs missing'));
          return;
        }
        initSqlJs({ locateFile: file => `${SQLJS_BASE}${file}` }).then(resolve).catch(reject);
      };
      script.onerror = () => reject(new Error('failed to load sql.js from CDN'));
      document.head.appendChild(script);
    });
    return sqlJsPromise;
  }

  const metricMatrixKey = {
    fitness: 'fitness_matrix',
    pop_ratio: 'pop_ratio_matrix',
    complexity: 'complexity_matrix',
    fecundity: 'fecundity_matrix',
  };

  function metricAxisLabel(m) {
    if (m === 'fitness') return 'Fitness score';
    if (m === 'pop_ratio') return 'Population ratio';
    if (m === 'complexity') return 'Mean complexity';
    if (m === 'fecundity') return 'Top individual duplications';
    return m;
  }

  function heatmapMatrix(hm, m) {
    const key = metricMatrixKey[m];
    const mat = hm[key];
    if (mat) return mat;
    return hm.y_labels.map(() => hm.x_labels.map(() => null));
  }

  function fecundityDataAvailable(heatmaps) {
    return heatmaps.some(hm =>
      hm.fecundity_matrix?.some(row => row.some(v => v !== null && v !== undefined))
    );
  }

  function setProbeResponseStatus(arch, message, tone = 'muted') {
    const panel = document.getElementById(`side-${arch}`);
    const el = panel?.querySelector('.probe-response-status');
    if (!el) return;
    el.textContent = message || '';
    el.style.display = message ? 'block' : 'none';
    el.classList.toggle('warn', tone === 'warn');
  }

  function responseSweepAxisLabel(axis) {
    if (axis === 'stores') return 'internal stores';
    if (axis === 'competition') return 'local competition';
    return 'center resource';
  }

  const ARCH_DISPLAY = {
    'Perceptron': 'Perceptron',
    'Multilayer perceptron (MLP)': 'Multilayer perceptron (MLP)',
    'MLP': 'Multilayer perceptron (MLP)',
    'Spatial macromolecule blob': 'Spatial macromolecule blob',
    'Spatial graph (SG)': 'Spatial graph (SG)',
    'Spatial Graph': 'Spatial graph (SG)',
    'Graph of operations (GoO)': 'Graph of operations (GoO)',
    'GoO': 'Graph of operations (GoO)',
  };

  function archDisplayName(raw) {
    return DATA.architecture_labels?.[raw] || ARCH_DISPLAY[raw] || raw;
  }

  /** Numeric-aware sort for sweep axis labels (nodes=1, nodes=2, … not nodes=1, nodes=12, nodes=2). */
  function compareAxisLabels(a, b) {
    const parse = (label) => {
      const eq = label.indexOf('=');
      if (eq >= 0) {
        const prefix = label.slice(0, eq);
        const n = Number(label.slice(eq + 1));
        if (Number.isFinite(n)) return { prefix, n, raw: label };
      }
      return { prefix: label, n: null, raw: label };
    };
    const ka = parse(a);
    const kb = parse(b);
    if (ka.prefix !== kb.prefix) return ka.prefix.localeCompare(kb.prefix);
    if (ka.n !== null && kb.n !== null) return ka.n - kb.n;
    return ka.raw.localeCompare(kb.raw);
  }

  function reorderHeatmapAxes(hm) {
    const xOrder = hm.x_labels.map((_, i) => i);
    xOrder.sort((i, j) => compareAxisLabels(hm.x_labels[i], hm.x_labels[j]));
    hm.x_labels = xOrder.map(i => hm.x_labels[i]);
    for (const key of ['fitness_matrix', 'pop_ratio_matrix', 'complexity_matrix', 'fecundity_matrix', 'fitness_na_matrix']) {
      if (!hm[key]) continue;
      hm[key] = hm[key].map(row => xOrder.map(i => row[i]));
    }
    const yOrder = hm.y_labels.map((_, i) => i);
    yOrder.sort((i, j) => compareAxisLabels(hm.y_labels[i], hm.y_labels[j]));
    hm.y_labels = yOrder.map(i => hm.y_labels[i]);
    for (const key of ['fitness_matrix', 'pop_ratio_matrix', 'complexity_matrix', 'fecundity_matrix', 'fitness_na_matrix']) {
      if (!hm[key]) continue;
      hm[key] = yOrder.map(i => hm[key][i]);
    }
  }

  /** Human-readable sweep axis labels (backward-compat with cap=). */
  function formatAxisLabel(label) {
    if (!label) return label;
    return label
      .replace(/^cap=/, 'max brain nodes=')
      .replace(/^max_brain_nodes=/, 'max brain nodes=')
      .replace(/^landmarks=/, 'landmarks=')
      .replace(/^layers=/, 'founder layers=')
      .replace(/^generate_nodes=/, 'GoO founder nodes=')
      .replace(/^goo_nodes=/, 'GoO founder nodes=')
      .replace(/^nodes=/, 'hidden nodes=')
      .replace(/^L1=/, 'layer 1 nodes=')
      .replace(/^L2=/, 'layer 2 nodes=');
  }

  function axisTooltip(label) {
    if (label.startsWith('max brain nodes=') || label.startsWith('max_brain_nodes=') || label.startsWith('cap=')) {
      return 'Structural size ceiling (max_brain_nodes): evolution cannot grow the brain beyond this complexity.';
    }
    if (label.startsWith('landmarks=')) return 'Founder landmark count in the spatial graph.';
    if (label.startsWith('founder layers=') || label.startsWith('layers=')) {
      return 'Founder layer count in the spatial macromolecule blob.';
    }
    if (label.startsWith('GoO founder nodes=') || label.startsWith('generate nodes=') || label.startsWith('generate_nodes=')) {
      return 'Founder GoO graph size (Gen/Agg/Score/KeepBest mix via grow_to_size).';
    }
    return '';
  }

  function colorScale(v, min, max, isNa, isPending) {
    if (isPending) return '#1a2030';
    if (isNa) return '#3a4254';
    if (v === null || v === undefined || Number.isNaN(v)) return '#2a3142';
    if (max <= min) return '#4c78a8';
    const t = Math.max(0, Math.min(1, (v - min) / (max - min)));
    const r = Math.round(43 + t * 212);
    const g = Math.round(108 + (t < 0.5 ? t * 80 : (1 - t) * 40));
    const b = Math.round(168 + (1 - t) * 40);
    return `rgb(${r},${g},${b})`;
  }

  function matrixRange(matrix, naMatrix) {
    const vals = [];
    matrix.forEach((row, yi) => row.forEach((v, xi) => {
      if (naMatrix?.[yi]?.[xi]) return;
      if (v !== null && v !== undefined) vals.push(v);
    }));
    if (!vals.length) return [0, 1];
    return [Math.min(...vals), Math.max(...vals)];
  }

  function cellKey(arch, x, y, founder) {
    return `${arch}|${x}|${y}|${founder}`;
  }

  function sanitizeFilenamePart(s) {
    return String(s).replace(/[^A-Za-z0-9\-_=]/g, '_');
  }

  function timelineFilename(arch, x, y, founder, seed) {
    return `${sanitizeFilenamePart(arch)}__${sanitizeFilenamePart(x)}__${sanitizeFilenamePart(y)}__${sanitizeFilenamePart(founder)}__seed${seed}.json`;
  }

  function timelineMatchesCell(entry, arch, x, y, founder) {
    return entry.architecture === arch
      && entry.x_label === x
      && entry.y_label === y
      && entry.founder_mode === founder;
  }

  async function ensureTimelineManifest() {
    if (timelineManifest && !timelineManifestPromise) return timelineManifest;
    if (timelineManifestError && !timelineManifestPromise) return null;
    if (!timelineManifestPromise) {
      timelineManifestPromise = fetch(`probe_timelines/manifest.json?_=${Date.now()}`)
        .then(r => {
          if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
          return r.json();
        })
        .then(data => {
          timelineManifest = data;
          timelineManifestError = '';
          return data;
        })
        .catch(e => {
          timelineManifestError = e.message || String(e);
          timelineManifest = null;
          return null;
        })
        .finally(() => {
          timelineManifestPromise = null;
        });
    }
    return timelineManifestPromise;
  }

  function resetTimelineCache() {
    timelineManifest = null;
    timelineManifestError = '';
    timelineManifestPromise = null;
    timelineCache.clear();
  }

  async function reloadProbeTimelinesForSelection() {
    resetTimelineCache();
    await ensureTimelineManifest();
    if (!selected) return;
    const panel = document.getElementById(`side-${selected.arch}`);
    if (panel) {
      await initHexProbe(selected.arch, selected.x, selected.y, selected.founder, findCell(selected.arch, selected.x, selected.y, selected.founder), panel);
    }
  }

  async function rebuildProbeTimelines() {
    const btn = document.getElementById('rebuild-timelines-btn');
    const prev = btn?.textContent;
    if (btn) {
      btn.disabled = true;
      btn.textContent = 'Rebuilding timelines…';
    }
    setMetaStatus('Rebuilding probe timelines from snapshots…');
    try {
      const r = await fetch('/api/rebuild-probe-timelines', { method: 'POST' });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || !data.ok) {
        const hint = r.status === 404
          ? 'Use: python scripts/serve_fitness_landscape.py (plain http.server cannot run rebuilds)'
          : (data.error || `${r.status} ${r.statusText}`);
        setMetaStatus(`Probe timeline rebuild failed — ${hint}`);
        return;
      }
      const s = data.summary;
      const msg = s
        ? `Probe timelines rebuilt — wrote ${s.written}, skipped ${s.skipped}.`
        : 'Probe timelines rebuilt.';
      setMetaStatus(msg);
      await reloadProbeTimelinesForSelection();
    } catch (e) {
      setMetaStatus(`Probe timeline rebuild failed — ${e.message || e}. Use python scripts/serve_fitness_landscape.py`);
    } finally {
      if (btn) {
        btn.disabled = false;
        btn.textContent = prev || 'Rebuild probe timelines';
      }
    }
  }

  async function probeTimelineApiAvailable() {
    try {
      const r = await fetch('/api/health');
      if (!r.ok) return false;
      const data = await r.json();
      return !!data.rebuild_probe_timelines;
    } catch {
      return false;
    }
  }

  async function fetchTimelineJson(filename) {
    if (timelineCache.has(filename)) return timelineCache.get(filename);
    try {
      const r = await fetch(`probe_timelines/${encodeURIComponent(filename)}?_=${Date.now()}`);
      if (!r.ok) return null;
      const data = await r.json();
      timelineCache.set(filename, data);
      return data;
    } catch {
      return null;
    }
  }

  async function loadTimelineForCell(arch, x, y, founder, seed) {
    const manifest = await ensureTimelineManifest();
    if (!manifest?.entries?.length) return null;
    const entry = manifest.entries.find(e =>
      timelineMatchesCell(e, arch, x, y, founder) && e.seed === seed
    );
    if (!entry) return null;
    return fetchTimelineJson(entry.file);
  }

  function timelineSeedsForCell(arch, x, y, founder) {
    if (!timelineManifest?.entries?.length) return [];
    return timelineManifest.entries
      .filter(e => timelineMatchesCell(e, arch, x, y, founder))
      .map(e => e.seed)
      .sort((a, b) => a - b);
  }

  function populateTimelineSeedSelect(panel, arch, x, y, founder) {
    const sel = panel?.querySelector('.probe-timeline-seed');
    if (!sel) return null;
    const seeds = timelineSeedsForCell(arch, x, y, founder);
    const runSeeds = runsForCell(arch, x, y, founder).map(r => r.seed);
    const merged = [...new Set([...seeds, ...runSeeds])].sort((a, b) => a - b);
    const prev = Number(sel.value);
    sel.innerHTML = '';
    if (!merged.length) {
      sel.disabled = true;
      const o = document.createElement('option');
      o.value = '';
      o.textContent = 'No timeline data';
      sel.appendChild(o);
      return null;
    }
    sel.disabled = false;
    for (const seed of merged) {
      const o = document.createElement('option');
      o.value = String(seed);
      o.textContent = `seed ${seed}${seeds.includes(seed) ? '' : ' (no timeline)'}`;
      sel.appendChild(o);
    }
    const preferred = seeds.includes(prev) ? prev : (seeds[0] ?? merged[0]);
    sel.value = String(preferred);
    return preferred;
  }

  function findCell(arch, x, y, founder) {
    return DATA.cells.find(c =>
      c.architecture === arch && c.x_label === x && c.y_label === y && c.founder_mode === founder
    );
  }

  function findDiagram(arch, x, y) {
    return DATA.cell_diagrams.find(d =>
      d.architecture === arch && d.x_label === x && d.y_label === y
    );
  }

  // --- Perlin (matches rust/src/perlin.rs) ---
  function perlinHash3(seed, xi, yi, zi) {
    let h = BigInt(seed)
      ^ (BigInt(xi) * 0x9E3779B97F4A7C15n)
      ^ (BigInt(yi) * 0xC2B2AE3D27D4EB4Fn)
      ^ (BigInt(zi) * 0x165667B19E3779F9n);
    h = h ^ (h >> 33n);
    h = h * 0xFF51AFD7ED558CCDn;
    h = h ^ (h >> 33n);
    h = h * 0xC4CEB9FE1A85EC53n;
    h = h ^ (h >> 33n);
    return h;
  }

  function perlinHashUnit(seed, xi, yi, zi) {
    const v = perlinHash3(seed, xi, yi, zi);
    return Number(v & 0xFFFFFFFFFFFFFn) / Number(0xFFFFFFFFFFFFFn);
  }

  function perlinSmoothstep(t) { return t * t * (3 - 2 * t); }
  function perlinLerp(a, b, t) { return a + (b - a) * t; }

  function perlinSample2dTime(x, y, time, seed, spatialScale, timeScale) {
    const s = Math.max(spatialScale, 1e-9);
    const ts = Math.max(timeScale, 1e-9);
    const xf = x * s, yf = y * s, tf = time * ts;
    const x0 = Math.floor(xf), y0 = Math.floor(yf), t0 = Math.floor(tf);
    const x1 = x0 + 1, y1 = y0 + 1, t1 = t0 + 1;
    const ux = perlinSmoothstep(xf - x0);
    const uy = perlinSmoothstep(yf - y0);
    const ut = perlinSmoothstep(tf - t0);
    const c000 = perlinHashUnit(seed, x0, y0, t0);
    const c100 = perlinHashUnit(seed, x1, y0, t0);
    const c010 = perlinHashUnit(seed, x0, y1, t0);
    const c110 = perlinHashUnit(seed, x1, y1, t0);
    const c001 = perlinHashUnit(seed, x0, y0, t1);
    const c101 = perlinHashUnit(seed, x1, y0, t1);
    const c011 = perlinHashUnit(seed, x0, y1, t1);
    const c111 = perlinHashUnit(seed, x1, y1, t1);
    const x00 = perlinLerp(c000, c100, ux);
    const x10 = perlinLerp(c010, c110, ux);
    const y0v = perlinLerp(x00, x10, uy);
    const x01 = perlinLerp(c001, c101, ux);
    const x11 = perlinLerp(c011, c111, ux);
    const y1v = perlinLerp(x01, x11, uy);
    return perlinLerp(y0v, y1v, ut);
  }

  function shapeResourceContrast(raw, contrast) {
    const r = Math.max(0, Math.min(1, raw));
    if (contrast <= 1.000000001) return r;
    return Math.max(0, Math.min(1, 0.5 + (r - 0.5) * contrast));
  }

  function scaledResource(raw, scale, contrast) {
    return shapeResourceContrast(raw, contrast) * scale;
  }

  function hexDisk(radius) {
    const coords = [];
    for (let dq = -radius; dq <= radius; dq++) {
      for (let dr = Math.max(-radius, -dq - radius); dr <= Math.min(radius, -dq + radius); dr++) {
        coords.push({ q: dq, r: dr });
      }
    }
    return coords;
  }

  const HEX_NEIGHBORS = [
    { q: 1, r: 0 }, { q: 1, r: -1 }, { q: 0, r: -1 },
    { q: -1, r: 0 }, { q: -1, r: 1 }, { q: 0, r: 1 },
  ];

  function hexKey(q, r) { return `${q},${r}`; }

  function axialToPixel(q, r, size) {
    const x = size * (3 / 2) * q;
    const y = size * (Math.sqrt(3) / 2 * q + Math.sqrt(3) * r);
    return { x, y };
  }

  function drawFlatHex(ctx, cx, cy, size) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const ang = (Math.PI / 180) * (60 * i);
      const px = cx + size * Math.cos(ang);
      const py = cy + size * Math.sin(ang);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  function buildResourceMap(meta) {
    const coords = hexDisk(HEX_PROBE_RADIUS);
    const maxRes = Number(meta.resource_scale) > 0 ? Number(meta.resource_scale) : 10;
    let minX = Infinity;
    let maxX = -Infinity;
    const xByKey = new Map();
    for (const { q, r } of coords) {
      const { x } = axialToPixel(q, r, 1);
      minX = Math.min(minX, x);
      maxX = Math.max(maxX, x);
      xByKey.set(hexKey(q, r), x);
    }
    const map = new Map();
    for (const { q, r } of coords) {
      const x = xByKey.get(hexKey(q, r));
      const t = maxX > minX ? (x - minX) / (maxX - minX) : 0.5;
      map.set(hexKey(q, r), t * maxRes);
    }
    return map;
  }

  function edgeResourcesAt(map, q, r) {
    return HEX_NEIGHBORS.map(n => map.get(hexKey(q + n.q, r + n.r)) ?? 0);
  }

  function resourceColor(v, maxV) {
    const t = maxV > 0 ? Math.max(0, Math.min(1, v / maxV)) : 0;
    const r = Math.round(30 + t * 40);
    const g = Math.round(50 + t * 130);
    const b = Math.round(90 + t * 60);
    return `rgb(${r},${g},${b})`;
  }

  async function ensureWasmProbe() {
    if (wasmProbe) return wasmProbe;
    if (wasmProbeError) return null;
    try {
      const mod = await import('./brain_playground_wasm/brain_playground_wasm.js');
      await mod.default();
      wasmProbe = mod;
      return mod;
    } catch (e) {
      wasmProbeError = e.message || String(e);
      return null;
    }
  }

  function parseProbeResult(jsonStr) {
    const parsed = JSON.parse(jsonStr);
    if (parsed.error) throw new Error(parsed.error);
    return parsed;
  }

  async function runForwardProbe(state) {
    const wasm = await ensureWasmProbe();
    if (!wasm || !state.brainJson) return null;
    const { agentQ, agentR, resourceMap, probeMeta } = state;
    const center = resourceMap.get(hexKey(agentQ, agentR)) ?? 0;
    const edges = edgeResourcesAt(resourceMap, agentQ, agentR);
    const pos = state.coords.findIndex(c => c.q === agentQ && c.r === agentR);
    const raw = wasm.forward_probe_json(
      state.brainJson,
      JSON.stringify(edges),
      center,
      state.competition,
      state.internalStores,
      Math.max(0, pos),
      probeMeta.movement_output_mode,
      probeMeta.movement_cost_factor,
    );
    return parseProbeResult(raw);
  }

  function decisionVector(decision) {
    if (!decision) return { dx: 0, dy: 0, magnitude: 0, label: '—' };
    const rad = (decision.direction_degrees * Math.PI) / 180;
    const mag = decision.move_one_step
      ? Math.max(0.05, Math.min(1, Math.abs(decision.move_signal)))
      : Math.max(0.05, Math.min(1, decision.gathered / 5));
    return {
      dx: Math.cos(rad) * mag,
      dy: -Math.sin(rad) * mag,
      magnitude: mag,
      label: decision.move_one_step
        ? `move · signal ${decision.move_signal.toFixed(3)} · ${decision.direction_degrees.toFixed(0)}°`
        : `gather · ${decision.gathered.toFixed(3)}`,
    };
  }

  function drawHexProbeCanvas(canvas, state, decision) {
    if (!canvas || !state) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth || 320;
    const h = canvas.clientHeight || 240;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    const hexSize = Math.min(w, h) / (HEX_PROBE_RADIUS * 3.4);
    const maxRes = Math.max(...state.coords.map(c => state.resourceMap.get(hexKey(c.q, c.r)) ?? 0), 0.001);

    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const c of state.coords) {
      const p = axialToPixel(c.q, c.r, hexSize);
      minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
      minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
    }
    const cx0 = w / 2 - (minX + maxX) / 2;
    const cy0 = h / 2 - (minY + maxY) / 2;

    for (const c of state.coords) {
      const res = state.resourceMap.get(hexKey(c.q, c.r)) ?? 0;
      const p = axialToPixel(c.q, c.r, hexSize);
      const cx = cx0 + p.x;
      const cy = cy0 + p.y;
      drawFlatHex(ctx, cx, cy, hexSize * 0.95);
      ctx.fillStyle = resourceColor(res, maxRes);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    const agentP = axialToPixel(state.agentQ, state.agentR, hexSize);
    const ax = cx0 + agentP.x;
    const ay = cy0 + agentP.y;
    drawFlatHex(ctx, ax, ay, hexSize * 0.72);
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fill();
    ctx.strokeStyle = '#7ee787';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#7ee787';
    ctx.beginPath();
    ctx.arc(ax, ay, hexSize * 0.22, 0, Math.PI * 2);
    ctx.fill();

    if (decision) {
      const vec = decisionVector(decision);
      const arrowLen = hexSize * 1.35 * vec.magnitude;
      const ex = ax + vec.dx * arrowLen;
      const ey = ay + vec.dy * arrowLen;
      ctx.strokeStyle = decision.move_one_step ? '#6ea8fe' : '#f0b429';
      ctx.fillStyle = ctx.strokeStyle;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(ex, ey);
      ctx.stroke();
      const head = hexSize * 0.22;
      const ang = Math.atan2(ey - ay, ex - ax);
      ctx.beginPath();
      ctx.moveTo(ex, ey);
      ctx.lineTo(ex - head * Math.cos(ang - 0.45), ey - head * Math.sin(ang - 0.45));
      ctx.lineTo(ex - head * Math.cos(ang + 0.45), ey - head * Math.sin(ang + 0.45));
      ctx.closePath();
      ctx.fill();
    }
  }

  function hexFromCanvasEvent(canvas, state, evt) {
    const rect = canvas.getBoundingClientRect();
    const mx = evt.clientX - rect.left;
    const my = evt.clientY - rect.top;
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    const hexSize = Math.min(w, h) / (HEX_PROBE_RADIUS * 3.4);
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const c of state.coords) {
      const p = axialToPixel(c.q, c.r, hexSize);
      minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
      minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
    }
    const cx0 = w / 2 - (minX + maxX) / 2;
    const cy0 = h / 2 - (minY + maxY) / 2;
    let best = null;
    let bestD = Infinity;
    for (const c of state.coords) {
      const p = axialToPixel(c.q, c.r, hexSize);
      const cx = cx0 + p.x;
      const cy = cy0 + p.y;
      const d = (mx - cx) ** 2 + (my - cy) ** 2;
      if (d < bestD) { bestD = d; best = c; }
    }
    return best;
  }

  async function refreshHexProbe(arch) {
    const probe = hexProbes.get(arch);
    if (!probe?.state) return;
    const decision = await runForwardProbe(probe.state);
    probe.lastDecision = decision;
    const panel = document.getElementById(`side-${arch}`);
    const decEl = panel?.querySelector('.probe-decision');
    if (decEl && decision) {
      const cls = decision.move_one_step ? 'move' : 'gather';
      decEl.innerHTML = `
        <span class="${cls}">${decision.move_one_step ? 'Move' : 'Gather'}</span>
        · signal ${decision.move_signal.toFixed(3)}
        · direction ${decision.direction_degrees.toFixed(1)}°
        ${decision.move_one_step
          ? `· spend ${decision.movement_spend.toFixed(2)}`
          : `· gathered ${decision.gathered.toFixed(3)}`}
      `;
    }
    drawHexProbeCanvas(probe.canvas, probe.state, decision);
    await updateResponseCurve(arch, probe);
  }

  async function runResponseSweep(probeState, axis, brainJson) {
    const wasm = await ensureWasmProbe();
    if (!wasm || !brainJson) return null;
    const steps = 25;
    const moveSignals = [];
    const directions = [];
    const labels = [];
    const saved = { ...probeState };

    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      let competition = saved.competition;
      let internalStores = saved.internalStores;
      let resourceMap = saved.resourceMap;
      if (axis === 'stores') {
        internalStores = t * 30;
      } else if (axis === 'competition') {
        competition = 1 + Math.round(t * 7);
      } else {
        const factor = 0.2 + t * 1.8;
        resourceMap = new Map(saved.resourceMap);
        const centerKey = hexKey(saved.agentQ, saved.agentR);
        const base = resourceMap.get(centerKey) ?? 0;
        resourceMap.set(centerKey, base * factor);
      }
      const state = { ...saved, competition, internalStores, resourceMap };
      const pos = state.coords.findIndex(c => c.q === state.agentQ && c.r === state.agentR);
      const center = resourceMap.get(hexKey(state.agentQ, state.agentR)) ?? 0;
      const edges = edgeResourcesAt(resourceMap, state.agentQ, state.agentR);
      const raw = wasm.forward_probe_json(
        brainJson,
        JSON.stringify(edges),
        center,
        state.competition,
        state.internalStores,
        Math.max(0, pos),
        state.probeMeta.movement_output_mode,
        state.probeMeta.movement_cost_factor,
      );
      const d = parseProbeResult(raw);
      labels.push(
        axis === 'stores' ? internalStores.toFixed(1)
          : axis === 'competition' ? String(competition)
            : (resourceMap.get(hexKey(saved.agentQ, saved.agentR)) ?? 0).toFixed(2),
      );
      moveSignals.push(d?.move_signal ?? 0);
      directions.push(d?.direction_degrees ?? 0);
    }
    return { labels, moveSignals, directions };
  }

  async function updateResponseCurve(arch, probe) {
    const panel = document.getElementById(`side-${arch}`);
    const chartCanvas = panel?.querySelector('canvas.probe-response-chart');
    const responseBox = panel?.querySelector('.probe-response-box');
    const timelineNote = panel?.querySelector('.probe-timeline-note');
    if (!chartCanvas) return;
    if (!probe?.state?.brainJson) {
      setProbeResponseStatus(arch, 'Response sweep unavailable — probe brain not in database.', 'warn');
      responseBox?.classList.remove('timeline-active');
      if (timelineNote) timelineNote.textContent = '';
      return;
    }
    const wasm = await ensureWasmProbe();
    if (!wasm) {
      setProbeResponseStatus(
        arch,
        `Response sweep unavailable — WASM: ${wasmProbeError || 'failed to load'}`,
        'warn',
      );
      return;
    }

    const axis = probe.sweepAxis || 'stores';
    setProbeResponseStatus(arch, 'Computing response sweep…');

    const timeline = probe.timeline;
    const chartId = `probe-${arch}`;
    if (charts.has(chartId)) charts.get(chartId).destroy();

    if (timeline?.timepoints?.length) {
      const datasets = [];
      let labels = null;
      for (const tp of timeline.timepoints) {
        if (tp.missing || !tp.brain_json) continue;
        const style = TIMELINE_STYLES[tp.steps] || {
          label: tp.label || `t=${tp.steps}`,
          color: '#c5d0e6',
          dash: [],
        };
        const sweep = await runResponseSweep(probe.state, axis, tp.brain_json);
        if (!sweep) continue;
        labels = sweep.labels;
        datasets.push({
          label: style.label,
          data: sweep.moveSignals,
          borderColor: style.color,
          backgroundColor: style.color + '1a',
          borderDash: style.dash,
          tension: 0.25,
          pointRadius: 0,
          yAxisID: 'y',
        });
      }

      if (datasets.length) {
        responseBox?.classList.add('timeline-active');
        if (timelineNote) {
          timelineNote.textContent =
            'Response sweep curves use best-by-resources individuals at each timepoint; hex map uses founder reference brain.';
        }
        charts.set(chartId, new Chart(chartCanvas, {
          type: 'line',
          data: { labels, datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#c5d0e6', boxWidth: 10, font: { size: 10 } } } },
            scales: {
              x: {
                title: {
                  display: true,
                  text: axis === 'stores' ? 'Internal stores' : axis === 'competition' ? 'Local competition' : 'Center resource',
                  color: '#9aa6bd',
                  font: { size: 10 },
                },
                ticks: { color: '#9aa6bd', maxTicksLimit: 8, font: { size: 9 } },
                grid: { color: 'rgba(255,255,255,0.05)' },
              },
              y: {
                position: 'left',
                title: { display: true, text: 'Move signal', color: '#9aa6bd', font: { size: 10 } },
                ticks: { color: '#9aa6bd', font: { size: 9 } },
                grid: { color: 'rgba(255,255,255,0.05)' },
              },
            },
          },
        }));

        const pending = timeline.timepoints
          .filter(tp => tp.steps > 0 && (tp.missing || !tp.brain_json))
          .map(tp => `${tp.steps / 1000}K`);
        const status = pending.length
          ? `Timeline probe (${responseSweepAxisLabel(axis)}): best by resources · pending: ${pending.join(', ')}`
          : `Timeline probe (${responseSweepAxisLabel(axis)}): t=0 / 10K / 50K best by resources.`;
        setProbeResponseStatus(arch, status);
        return;
      }
    }

    responseBox?.classList.remove('timeline-active');
    if (timelineNote) timelineNote.textContent = '';

    const sweep = await runResponseSweep(probe.state, axis, probe.state.brainJson);
    if (!sweep) return;

    charts.set(chartId, new Chart(chartCanvas, {
      type: 'line',
      data: {
        labels: sweep.labels,
        datasets: [
          {
            label: 'move signal',
            data: sweep.moveSignals,
            borderColor: '#6ea8fe',
            backgroundColor: 'rgba(110,168,254,0.12)',
            tension: 0.25,
            pointRadius: 0,
            yAxisID: 'y',
          },
          {
            label: 'direction °',
            data: sweep.directions,
            borderColor: '#f0b429',
            borderDash: [4, 3],
            tension: 0.25,
            pointRadius: 0,
            yAxisID: 'y1',
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#c5d0e6', boxWidth: 10, font: { size: 10 } } } },
        scales: {
          x: {
            title: {
              display: true,
              text: axis === 'stores' ? 'Internal stores' : axis === 'competition' ? 'Local competition' : 'Center resource',
              color: '#9aa6bd',
              font: { size: 10 },
            },
            ticks: { color: '#9aa6bd', maxTicksLimit: 8, font: { size: 9 } },
            grid: { color: 'rgba(255,255,255,0.05)' },
          },
          y: {
            position: 'left',
            title: { display: true, text: 'Move signal', color: '#9aa6bd', font: { size: 10 } },
            ticks: { color: '#9aa6bd', font: { size: 9 } },
            grid: { color: 'rgba(255,255,255,0.05)' },
          },
          y1: {
            position: 'right',
            min: 0,
            max: 360,
            title: { display: true, text: 'Direction °', color: '#9aa6bd', font: { size: 10 } },
            ticks: { color: '#9aa6bd', font: { size: 9 } },
            grid: { drawOnChartArea: false },
          },
        },
      },
    }));

    const flat = sweep.moveSignals.every(v => v === 0) && sweep.directions.every(v => v === 0);
    if (flat) {
      setProbeResponseStatus(
        arch,
        `Response sweep flat on ${responseSweepAxisLabel(axis)} — brain may not respond on this axis.`,
        'warn',
      );
    } else {
      setProbeResponseStatus(arch, `Response sweep ready (${responseSweepAxisLabel(axis)}).`);
    }
  }

  function wireHexProbePanel(arch, panel) {
    if (panel.dataset.probeWired === '1') return;
    panel.dataset.probeWired = '1';
    const canvas = panel.querySelector('canvas.hex-probe-canvas');
    const competition = panel.querySelector('.probe-competition');
    const stores = panel.querySelector('.probe-stores');
    const sweepAxis = panel.querySelector('.probe-sweep-axis');
    const timelineSeed = panel.querySelector('.probe-timeline-seed');
    if (!canvas) return;

    const onChange = async () => {
      const probe = hexProbes.get(arch);
      if (!probe?.state) return;
      probe.state.competition = Number(competition.value);
      probe.state.internalStores = Number(stores.value);
      probe.sweepAxis = sweepAxis.value;
      if (timelineSeed && probe.cellRef) {
        const seed = Number(timelineSeed.value);
        if (Number.isFinite(seed)) {
          probe.timeline = await loadTimelineForCell(
            probe.cellRef.arch,
            probe.cellRef.x,
            probe.cellRef.y,
            probe.cellRef.founder,
            seed,
          );
        }
      }
      refreshHexProbe(arch);
    };

    competition?.addEventListener('input', onChange);
    stores?.addEventListener('input', onChange);
    sweepAxis?.addEventListener('change', onChange);
    timelineSeed?.addEventListener('change', onChange);

    canvas.addEventListener('click', evt => {
      const probe = hexProbes.get(arch);
      if (!probe?.state) return;
      const hit = hexFromCanvasEvent(canvas, probe.state, evt);
      if (!hit) return;
      probe.state.agentQ = hit.q;
      probe.state.agentR = hit.r;
      refreshHexProbe(arch);
    });
  }

  async function initHexProbe(arch, x, y, founder, cell, panel) {
    const diag = findDiagram(arch, x, y);
    const statsEl = panel.querySelector('.probe-stats');
    const wasmNote = panel.querySelector('.probe-wasm-note');
    const canvas = panel.querySelector('canvas.hex-probe-canvas');

    await ensureTimelineManifest();
    const timelineSeed = populateTimelineSeedSelect(panel, arch, x, y, founder);
    let timeline = null;
    if (timelineSeed != null) {
      timeline = await loadTimelineForCell(arch, x, y, founder, timelineSeed);
    }

    if (!cell) {
      if (statsEl) statsEl.textContent = 'No data for this cell.';
      setProbeResponseStatus(arch, 'Select a heatmap cell to run response sweep.');
      hexProbes.set(arch, { canvas, sweepAxis: 'stores', state: null, timeline: null, cellRef: null, lastDecision: null });
      return;
    }

    if (statsEl) {
      statsEl.innerHTML = `
        <strong>${formatAxisLabel(x)}</strong> × <strong>${formatAxisLabel(y)}</strong>
        · ${archDisplayName(arch)} · founder: <strong>${founder}</strong><br/>
        ${cell.data_na
          ? '<span style="color:var(--warn)">N/A — immediate extinction</span>'
          : `fitness μ=${cell.fitness_mean.toFixed(3)} · pop μ=${cell.pop_ratio_mean.toFixed(3)} · complexity μ=${cell.complexity_mean.toFixed(2)}`}
      `;
    }

    if (!diag?.brain_json || !diag?.probe_meta) {
      if (timeline?.probe_meta && timeline.timepoints?.some(tp => !tp.missing && tp.brain_json)) {
        const probeMeta = timeline.probe_meta;
        const resourceMap = buildResourceMap(probeMeta);
        const coords = hexDisk(HEX_PROBE_RADIUS);
        hexProbes.set(arch, {
          canvas,
          sweepAxis: panel.querySelector('.probe-sweep-axis')?.value || 'stores',
          state: {
            brainJson: timeline.timepoints.find(tp => !tp.missing && tp.brain_json)?.brain_json || '',
            probeMeta,
            resourceMap,
            coords,
            agentQ: 0,
            agentR: 0,
            competition: Number(panel.querySelector('.probe-competition')?.value || 1),
            internalStores: Number(panel.querySelector('.probe-stores')?.value || 10),
          },
          timeline,
          cellRef: { arch, x, y, founder },
          lastDecision: null,
        });
        wireHexProbePanel(arch, panel);
        await refreshHexProbe(arch);
        return;
      }
      if (wasmNote) {
        wasmNote.textContent = 'Probe brain not in database — re-run sweep to export founder weights.';
      }
      setProbeResponseStatus(arch, 'Response sweep unavailable — probe brain not in database.', 'warn');
      return;
    }

    await ensureWasmProbe();
    if (wasmNote) {
      wasmNote.textContent = wasmProbeError
        ? `WASM probe unavailable (${wasmProbeError}). Serve via HTTP with brain_playground_wasm/ beside the HTML.`
        : 'Deterministic left→right resource gradient · click hex to move agent';
    }
    if (wasmProbeError) {
      setProbeResponseStatus(arch, `Response sweep unavailable — WASM: ${wasmProbeError}`, 'warn');
    }

    const probeMeta = diag.probe_meta;
    const resourceMap = buildResourceMap(probeMeta);
    const coords = hexDisk(HEX_PROBE_RADIUS);
    hexProbes.set(arch, {
      canvas,
      sweepAxis: panel.querySelector('.probe-sweep-axis')?.value || 'stores',
      state: {
        brainJson: diag.brain_json,
        probeMeta,
        resourceMap,
        coords,
        agentQ: 0,
        agentR: 0,
        competition: Number(panel.querySelector('.probe-competition')?.value || 1),
        internalStores: Number(panel.querySelector('.probe-stores')?.value || 10),
      },
      timeline,
      cellRef: { arch, x, y, founder },
      lastDecision: null,
    });
    wireHexProbePanel(arch, panel);
    await refreshHexProbe(arch);
  }

  function runsForCell(arch, x, y, founder) {
    return DATA.runs.filter(r =>
      r.architecture === arch && r.x_label === x && r.y_label === y && r.founder_mode === founder
    );
  }

  function renderBrainDiagram(canvas, diagram) {
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    // Fixed fallbacks if layout not ready; CSS .brain-canvas should supply 100% × 200px.
    const w = Math.max(1, Math.floor(rect.width) || 360);
    const h = Math.max(1, Math.floor(rect.height) || 200);
    const bw = Math.floor(w * dpr);
    const bh = Math.floor(h * dpr);
    if (canvas.width !== bw || canvas.height !== bh) {
      canvas.width = bw;
      canvas.height = bh;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    if (!diagram) {
      ctx.fillStyle = '#6b7280';
      ctx.font = '13px sans-serif';
      ctx.fillText('Select a cell to view brain topology', 14, 28);
      return;
    }
    const sx = w / diagram.width;
    const sy = h / diagram.height;
    const s = Math.min(sx, sy);
    const ox = (w - diagram.width * s) / 2;
    const oy = (h - diagram.height * s) / 2;
    const bg = diagram.panel_bg || { r: 18, g: 22, b: 30 };
    ctx.fillStyle = `rgb(${bg.r},${bg.g},${bg.b})`;
    ctx.fillRect(0, 0, w, h);
    for (const e of diagram.edges || []) {
      const c = e.color || { r: 120, g: 140, b: 180, a: 180 };
      ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},${(c.a ?? 200) / 255})`;
      ctx.lineWidth = Math.max(0.5, (e.width || 1) * s);
      ctx.beginPath();
      ctx.moveTo(ox + e.x1 * s, oy + e.y1 * s);
      ctx.lineTo(ox + e.x2 * s, oy + e.y2 * s);
      ctx.stroke();
    }
    for (const n of diagram.nodes || []) {
      const fill = n.fill || { r: 100, g: 150, b: 255 };
      ctx.fillStyle = `rgb(${fill.r},${fill.g},${fill.b})`;
      ctx.beginPath();
      ctx.arc(ox + n.x * s, oy + n.y * s, (n.r || 8) * s, 0, Math.PI * 2);
      ctx.fill();
      if (n.label) {
        ctx.fillStyle = `rgb(${(n.label_color||{r:230,g:235,b:245}).r},${(n.label_color||{}).g||235},${(n.label_color||{}).b||245})`;
        ctx.font = `${Math.max(9, (n.label_size || 11) * s)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(n.label, ox + n.x * s, oy + n.y * s + 3 * s);
      }
    }
    for (const t of diagram.texts || []) {
      const c = t.color || { r: 200, g: 205, b: 215 };
      ctx.fillStyle = `rgb(${c.r},${c.g},${c.b})`;
      ctx.font = `${Math.max(9, (t.size || 11) * s)}px sans-serif`;
      ctx.textAlign = t.align === 'center' ? 'center' : (t.align === 'right' ? 'right' : 'left');
      ctx.fillText(t.text, ox + t.x * s, oy + t.y * s);
    }
  }

  function trajectoryConverged(traj) {
    if (!traj || traj.length < 4) return false;
    const tail = traj.slice(-3);
    const first = tail[0].fitness;
    const last = tail[tail.length - 1].fitness;
    if (first === 0 && last === 0) return false;
    return Math.abs(last - first) / Math.max(0.001, Math.abs(first)) < 0.03;
  }

  function updateSidePanel(arch, x, y, founder) {
    const cell = findCell(arch, x, y, founder);
    const panel = document.getElementById(`side-${arch}`);
    if (!panel) return;
    const chartCanvas = panel.querySelector('canvas.trajectory-chart');
    const brainCanvas = panel.querySelector('canvas.brain-canvas');
    const conv = panel.querySelector('.convergence-note');

    initHexProbe(arch, x, y, founder, cell, panel);

    if (!cell) {
      return;
    }

    const chartId = `chart-${arch}`;
    if (charts.has(chartId)) charts.get(chartId).destroy();

    const datasets = [];
    if (compareSeeds && DATA.founder_modes.length > 1) {
      for (const fm of DATA.founder_modes) {
        const c = findCell(arch, x, y, fm);
        if (!c || !c.trajectory_mean?.length) continue;
        const color = fm === 'neutral' ? '#6ea8fe' : (fm === 'random_uniform' ? '#7ee787' : '#f0b429');
        datasets.push({
          label: fm,
          data: c.trajectory_mean.map(p => ({ x: p.step, y: p[metric === 'complexity' ? 'avg_complexity' : metric === 'pop_ratio' ? 'pop_ratio' : 'fitness'] })),
          borderColor: color,
          backgroundColor: color + '33',
          tension: 0.2,
          pointRadius: 0,
          borderWidth: 2,
        });
      }
    } else {
      const yKey = metric === 'complexity' ? 'avg_complexity' : metric === 'pop_ratio' ? 'pop_ratio' : 'fitness';
      for (const run of runsForCell(arch, x, y, founder)) {
        datasets.push({
          label: `seed ${run.seed}`,
          data: (run.trajectory || []).map(p => ({ x: p.step, y: p[yKey] })),
          borderColor: 'rgba(200,210,230,0.35)',
          borderDash: [4, 4],
          tension: 0.2,
          pointRadius: 0,
          borderWidth: 1,
        });
      }
    }

    if (chartCanvas) {
      charts.set(chartId, new Chart(chartCanvas, {
        type: 'line',
        data: { datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          parsing: false,
          scales: {
            x: {
              type: 'linear',
              title: { display: true, text: 'Step', color: '#9aa6bd' },
              ticks: { color: '#9aa6bd' },
              grid: { color: 'rgba(255,255,255,0.06)' },
            },
            y: {
              title: {
                display: true,
                text: metricAxisLabel(metric),
                color: '#9aa6bd',
              },
              ticks: { color: '#9aa6bd' },
              grid: { color: 'rgba(255,255,255,0.06)' },
            },
          },
          plugins: {
            legend: { labels: { color: '#c5d0e6', boxWidth: 12 } },
          },
        },
      }));
    }

    const diag = findDiagram(arch, x, y);
    renderBrainDiagram(brainCanvas, diag?.diagram);
    const converged = trajectoryConverged(cell.trajectory_mean);
    conv.textContent = converged
      ? 'Trajectory looks plateaued in the last samples — 30k steps may be enough for this cell.'
      : 'Trajectory still moving at end of run — consider longer sweeps for this cell.';
    conv.style.display = cell.trajectory_mean?.length ? 'block' : 'none';
  }

  function metaValue(db, key, fallback = '') {
    const stmt = db.prepare('SELECT value FROM meta WHERE key = ?');
    stmt.bind([key]);
    if (stmt.step()) {
      const v = stmt.get()[0];
      stmt.free();
      return v ?? fallback;
    }
    stmt.free();
    return fallback;
  }

  function queryAll(db, sql) {
    const res = db.exec(sql);
    if (!res.length) return [];
    const cols = res[0].columns;
    return res[0].values.map(row => {
      const obj = {};
      cols.forEach((c, i) => { obj[c] = row[i]; });
      return obj;
    });
  }

  function buildDataFromDb(db) {
    const founderModes = JSON.parse(metaValue(db, 'founder_modes', '[]'));
    return {
      version: metaValue(db, 'version', ''),
      build_id: metaValue(db, 'build_id', ''),
      steps: Number(metaValue(db, 'steps', '0')),
      replicates: Number(metaValue(db, 'replicates', '0')),
      founder_modes: founderModes,
      status: metaValue(db, 'status', 'complete'),
      run_count: Number(metaValue(db, 'run_count', '0')),
      total_runs: Number(metaValue(db, 'total_runs', '0')),
      updated_at_ms: Number(metaValue(db, 'updated_at_ms', '0')),
      complexity_help: JSON.parse(metaValue(db, 'complexity_help', '{}')),
      fitness_help: JSON.parse(metaValue(db, 'fitness_help', '{}')),
      architecture_labels: JSON.parse(metaValue(db, 'architecture_labels', '{}')),
      runs: queryAll(db, 'SELECT * FROM runs').map(r => ({
        architecture: r.architecture,
        x_label: r.x_label,
        y_label: r.y_label,
        founder_mode: r.founder_mode,
        seed: r.seed,
        steps_completed: r.steps_completed,
        final_population: r.final_population,
        max_population: r.max_population,
        pop_ratio: r.pop_ratio,
        avg_resources: r.avg_resources,
        avg_complexity: r.avg_complexity,
        prop_moved_final: r.prop_moved_final,
        fitness_score: r.fitness_score,
        immediate_extinction: !!r.immediate_extinction,
        trajectory: JSON.parse(r.trajectory_json || '[]'),
      })),
      cells: queryAll(db, 'SELECT * FROM cells').map(c => ({
        architecture: c.architecture,
        x_label: c.x_label,
        y_label: c.y_label,
        founder_mode: c.founder_mode,
        replicates: c.replicates,
        fitness_mean: c.fitness_mean,
        fitness_std: c.fitness_std,
        pop_ratio_mean: c.pop_ratio_mean,
        complexity_mean: c.complexity_mean,
        data_na: !!c.data_na,
        trajectory_mean: JSON.parse(c.trajectory_mean_json || '[]'),
      })),
      heatmaps: queryAll(db, 'SELECT * FROM heatmaps').map(h => ({
        architecture: h.architecture,
        founder_mode: h.founder_mode,
        x_labels: JSON.parse(h.x_labels_json || '[]'),
        y_labels: JSON.parse(h.y_labels_json || '[]'),
        fitness_matrix: JSON.parse(h.fitness_matrix_json || '[]'),
        fitness_na_matrix: JSON.parse(h.fitness_na_matrix_json || '[]'),
        pop_ratio_matrix: JSON.parse(h.pop_ratio_matrix_json || '[]'),
        complexity_matrix: JSON.parse(h.complexity_matrix_json || '[]'),
      })),
      cell_diagrams: queryAll(db, 'SELECT * FROM cell_diagrams').map(d => ({
        architecture: d.architecture,
        x_label: d.x_label,
        y_label: d.y_label,
        structure_signature: d.structure_signature,
        diagram: JSON.parse(d.diagram_json || '{}'),
        brain_json: d.brain_json || null,
        probe_meta: d.probe_meta_json ? JSON.parse(d.probe_meta_json) : null,
      })),
    };
  }

  async function openSqliteBuffer(buffer) {
    const SQL = await loadSqlJsModule();
    return new SQL.Database(new Uint8Array(buffer));
  }

  async function loadLandscapeFromBuffer(buffer, sourceLabel) {
    try {
      const db = await openSqliteBuffer(buffer);
      const next = buildDataFromDb(db);
      db.close();
      const changed = !DATA || next.updated_at_ms !== lastUpdatedAtMs || next.run_count !== DATA.run_count;
      DATA = next;
      lastUpdatedAtMs = next.updated_at_ms || 0;
      window.__landscapeSource = sourceLabel;
      if (!viewerBooted || changed) {
        bootViewer();
      } else {
        updateMetaLine();
      }
      syncLivePolling();
    } catch (err) {
      console.error('loadLandscapeFromBuffer', err);
      if (DATA?.heatmaps?.length) {
        setMetaStatus(`Heatmaps loaded · database refresh failed (${err.message})`);
        syncLivePolling();
        return;
      }
      throw err;
    }
  }

  function progressLabel() {
    if (!DATA) return '';
    if (DATA.status === 'running' && DATA.total_runs > 0) {
      return ` · sweep ${DATA.run_count}/${DATA.total_runs} runs`;
    }
    if (DATA.total_runs > 0 && DATA.run_count < DATA.total_runs) {
      return ` · ${DATA.run_count}/${DATA.total_runs} runs`;
    }
    return '';
  }

  function updateMetaLine() {
    const src = window.__landscapeSource || 'database';
    const liveTag = DATA?.status === 'running' ? ' · live sweep' : '';
    document.getElementById('meta-line').textContent =
      `build ${DATA.build_id} · ${DATA.steps.toLocaleString()} steps/run · ${DATA.replicates} replicates · modes: ${DATA.founder_modes.join(', ')} · source: ${src}${progressLabel()}${liveTag}`;
  }

  async function pollLiveUpdate() {
    if (!liveEnabled || !dbUrl) return;
    try {
      const resp = await fetch(`${dbUrl}?t=${Date.now()}`, { cache: 'no-store' });
      if (!resp.ok) return;
      const buf = await resp.arrayBuffer();
      await loadLandscapeFromBuffer(buf, dbUrl);
    } catch {
      /* sweep may not have started yet */
    }
  }

  function syncLivePolling() {
    const shouldPoll = liveEnabled && (
      !DATA ||
      DATA.status === 'running' ||
      (DATA.total_runs > 0 && DATA.run_count < DATA.total_runs)
    );
    if (shouldPoll && !livePollTimer) {
      livePollTimer = setInterval(pollLiveUpdate, 2000);
    } else if (!shouldPoll && livePollTimer) {
      clearInterval(livePollTimer);
      livePollTimer = null;
    }
    const btn = document.getElementById('live-btn');
    if (btn) btn.classList.toggle('active', liveEnabled);
  }

  function parseEmbeddedLandscape() {
    const raw = document.getElementById('landscape-data')?.textContent?.trim();
    if (!raw || raw === 'null' || raw === '__LANDSCAPE_JSON__') return null;
    try {
      const parsed = JSON.parse(raw);
      parsed.status = parsed.status || 'complete';
      parsed.run_count = Number(parsed.run_count ?? 0);
      parsed.total_runs = Number(parsed.total_runs ?? 0);
      parsed.updated_at_ms = Number(parsed.updated_at_ms ?? 0);
      return parsed;
    } catch {
      return null;
    }
  }

  async function loadLandscapeData() {
    const params = new URLSearchParams(location.search);
    dbUrl = params.get('db') || 'fitness_landscape.sqlite';
    if (params.get('live') === '0') liveEnabled = false;

    setMetaStatus('Reading embedded heatmaps…');

    const embedded = parseEmbeddedLandscape();
    if (embedded?.heatmaps?.length) {
      DATA = embedded;
      window.__landscapeSource = 'embedded JSON (heatmaps)';
      bootViewer();
    }

    try {
      setMetaStatus(DATA?.heatmaps?.length
        ? 'Loading database for cell diagrams and live updates…'
        : 'Loading fitness_landscape.sqlite…');
      const resp = await fetch(`${dbUrl}?t=${Date.now()}`, { cache: 'no-store' });
      if (!resp.ok) throw new Error(`fetch failed (${resp.status})`);
      const buf = await resp.arrayBuffer();
      await loadLandscapeFromBuffer(buf, dbUrl);
      return;
    } catch (fetchErr) {
      console.error('loadLandscapeData', fetchErr);
      if (DATA?.heatmaps?.length) {
        setMetaStatus(`Heatmaps ready · ${fetchErr.message} (retrying every 2s)`);
        syncLivePolling();
        return;
      }
      setMetaStatus(`Could not load ${dbUrl} — serve this folder over HTTP or use “Load database…”. (${fetchErr.message})`);
      document.getElementById('root').innerHTML =
        '<p class="empty-hint">Waiting for fitness_landscape.sqlite. Start a sweep or click Load database… — live updates poll every 2s once the DB appears.</p>';
      syncLivePolling();
    }
  }

  function bootViewer() {
    viewerBooted = true;
    if (!DATA) {
      document.getElementById('root').innerHTML = '<p class="empty-hint">No landscape data loaded.</p>';
      return;
    }
    if (DATA.heatmaps?.length) {
      DATA.heatmaps.forEach(reorderHeatmapAxes);
    }
    const help = DATA.complexity_help;
    document.getElementById('complexity-help').dataset.tip = help?.tooltip || 'Population-mean brain complexity.';
    const fhelp = DATA.fitness_help;
    const fitnessTip = fhelp
      ? `${fhelp.tooltip}\n\n${fhelp.formula}`
      : 'fitness = pop_ratio × (0.55 + 0.25×resource_term + 0.20×complexity_term) × cap_penalty';
    document.getElementById('fitness-help').dataset.tip = fitnessTip;
    updateMetaLine();

    const archSel = document.getElementById('arch-filter');
    const prevArch = archSel.value || 'all';
    archSel.innerHTML = '<option value="all">All architectures</option>';
    const arches = [...new Set((DATA.heatmaps || []).map(h => h.architecture))].sort();
    arches.forEach(a => {
      const o = document.createElement('option');
      o.value = a;
      o.textContent = archDisplayName(a);
      archSel.appendChild(o);
    });
    if ([...archSel.options].some(o => o.value === prevArch)) archSel.value = prevArch;

    const founderSel = document.getElementById('founder-filter');
    const prevFounder = founderSel.value || DATA.founder_modes[0];
    founderSel.innerHTML = '';
    DATA.founder_modes.forEach(f => {
      const o = document.createElement('option');
      o.value = f; o.textContent = f;
      founderSel.appendChild(o);
    });
    if (prevFounder && DATA.founder_modes.includes(prevFounder)) founderSel.value = prevFounder;

    if (!DATA.heatmaps?.length) {
      const prog = DATA.run_count > 0
        ? `${DATA.run_count} run(s) completed — heatmap skeleton missing from export`
        : DATA.total_runs > 0
          ? `0/${DATA.total_runs} runs — waiting for sweep output`
          : 'waiting for sweep metadata';
      document.getElementById('root').innerHTML =
        `<p class="empty-hint">Sweep in progress — ${prog}.</p>`;
      syncLivePolling();
      return;
    }

    renderAll();
    syncLivePolling();
    probeTimelineApiAvailable().then(ok => {
      const btn = document.getElementById('rebuild-timelines-btn');
      if (!btn) return;
      btn.title = ok
        ? 'Rebuild probe_timelines/ from stage snapshots (runs build_probe_timelines.ps1 -SweepOutputModes)'
        : 'Rebuild requires: python scripts/serve_fitness_landscape.py (plain http.server cannot run rebuilds)';
    });
  }

  function updateSweepProgressHint() {
    const root = document.getElementById('root');
    root.querySelector('.sweep-progress-hint')?.remove();
    if (metric === 'fecundity' || DATA?.status !== 'running' || !(DATA.total_runs > 0) || !DATA.heatmaps?.length) return;
    const pending = DATA.heatmaps.reduce((n, hm) => {
      const m = heatmapMatrix(hm, metric);
      return n + m.flat().filter(v => v === null || v === undefined).length;
    }, 0);
    const hint = document.createElement('p');
    hint.className = 'empty-hint sweep-progress-hint';
    hint.style.margin = '0 16px 12px';
    hint.textContent = `${pending} cell(s) still pending · ${DATA.run_count}/${DATA.total_runs} runs finished`;
    root.prepend(hint);
  }

  function wireControlsOnce() {
    if (window.__landscapeControlsWired) return;
    window.__landscapeControlsWired = true;
    document.getElementById('metric-toggle').addEventListener('click', e => {
      const btn = e.target.closest('button[data-metric]');
      if (!btn) return;
      metric = btn.dataset.metric;
      document.querySelectorAll('#metric-toggle button').forEach(b => b.classList.toggle('active', b === btn));
      renderAll();
    });
    document.getElementById('founder-filter').addEventListener('change', renderAll);
    document.getElementById('arch-filter').addEventListener('change', renderAll);
    document.getElementById('compare-seeds-btn').addEventListener('click', () => {
      compareSeeds = !compareSeeds;
      document.getElementById('compare-seeds-btn').textContent = compareSeeds
        ? 'Showing seed comparison'
        : 'Compare seed modes';
      if (selected) updateSidePanel(selected.arch, selected.x, selected.y, selected.founder);
    });
    document.getElementById('rebuild-timelines-btn').addEventListener('click', () => {
      rebuildProbeTimelines();
    });
    document.getElementById('load-db-btn').addEventListener('click', () => {
      document.getElementById('db-file-input').click();
    });
    document.getElementById('live-btn').addEventListener('click', () => {
      liveEnabled = !liveEnabled;
      document.getElementById('live-btn').classList.toggle('active', liveEnabled);
      document.getElementById('live-btn').textContent = liveEnabled ? 'Live updates' : 'Live updates (off)';
      syncLivePolling();
      if (liveEnabled) pollLiveUpdate();
    });
    document.getElementById('db-file-input').addEventListener('change', async e => {
      const file = e.target.files?.[0];
      if (!file) return;
      liveEnabled = false;
      dbUrl = '';
      const buf = await file.arrayBuffer();
      await loadLandscapeFromBuffer(buf, file.name);
    });
  }

  wireControlsOnce();
  loadLandscapeData();
  </script>
</body>
</html>
