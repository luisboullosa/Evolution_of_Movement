[package]
name = "evo_movement_rust"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
default = ["cuda", "gui", "sqlite"]
cuda = ["dep:cust", "dep:wgpu", "dep:bytemuck", "dep:pollster"]
gui = ["dep:eframe", "dep:egui", "dep:egui_extras"]
playground = []
sqlite = ["dep:rusqlite"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
rand = "0.8"
rand_distr = "0.4"
serde_cbor = "0.11"
cust = { version = "0.3.2", optional = true }

# GUI and visualization
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow"], optional = true }
egui = { version = "0.27", optional = true }
egui_extras = { version = "0.27", optional = true }

# GPU compute
wgpu = { version = "0.19", optional = true }
bytemuck = { version = "1.14", features = ["derive"], optional = true }
pollster = { version = "0.3", optional = true }

[build-dependencies]
chrono = "0.4"

[[bin]]
name = "evo_movement_bin_old"
path = "src/bin/evo_movement_rust.rs"

[[bin]]
name = "evo_movement_interactive"
path = "src/bin/interactive.rs"

[[bin]]
name = "evo_movement_lab"
path = "src/bin/lab.rs"

[[bin]]
name = "evo_movement_perceptron"
path = "src/bin/evo_movement_perceptron.rs"

[[bin]]
name = "evo_movement_mlp"
path = "src/bin/evo_movement_mlp.rs"

[[bin]]
name = "evo_movement_spatial"
path = "src/bin/evo_movement_spatial.rs"

[[bin]]
name = "evo_movement_goo"
path = "src/bin/evo_movement_goo.rs"

[[bin]]
name = "evo_snapshot_import"
path = "src/bin/import_snapshots.rs"

[[bin]]
name = "evo_fitness_landscape"
path = "src/bin/evo_fitness_landscape.rs"
required-features = ["sqlite"]

[package.metadata]
build_script = true
