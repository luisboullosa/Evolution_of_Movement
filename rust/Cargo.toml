[package]
name = "evo_movement_rust"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_distr = "0.4"
serde_cbor = "0.11"

[build-dependencies]
chrono = "0.4"

[[bin]]
name = "evo_movement_bin_old"
path = "src/bin/evo_movement_rust.rs"

[package.metadata]
build_script = true
