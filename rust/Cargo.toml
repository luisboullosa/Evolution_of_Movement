[package]
name = "evo_movement_rust"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_distr = "0.4"
serde_cbor = "0.11"

# GUI and visualization
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.27"
egui_extras = "0.27"

# GPU compute
wgpu = "0.19"
bytemuck = { version = "1.14", features = ["derive"] }
pollster = "0.3"

[build-dependencies]
chrono = "0.4"

[[bin]]
name = "evo_movement_bin_old"
path = "src/bin/evo_movement_rust.rs"

[[bin]]
name = "evo_movement_interactive"
path = "src/bin/interactive.rs"

[package.metadata]
build_script = true
